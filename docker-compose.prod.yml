version: "3.9"

services:
  backend:
    image: ghcr.io/gradimbuyi/wealthtrackit-backend:latest
    container_name: w-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    networks:
      - w-network

  frontend:
    image: ghcr.io/gradimbuyi/wealthtrackit-frontend:latest
    container_name: w-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - w-network

networks:
  w-network:
    driver: bridge

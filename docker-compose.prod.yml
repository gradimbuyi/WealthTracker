version: "3.9"

services:
  backend:
    image: ghcr.io/gradimbuyi/wealthtrackit-backend:latest
    container_name: w-backend
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "5000"
    networks:
      - w-network

  frontend:
    image: ghcr.io/gradimbuyi/wealthtrackit-frontend:latest
    container_name: w-frontend
    restart: unless-stopped
    expose:
      - "80"
    networks:
      - w-network
  
  nginx:
    image: nginx:alpine
    container_name: w-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - w-network

networks:
  w-network:
    driver: bridge
name: CI

on:
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Backend Image
        run: |
          docker build \
            -t wealthtrackit-backend:ci \
            ./backend

      - name: Build Frontend Image
        run: |
          docker build \
            -t wealthtrackit-frontend:ci \
            ./frontend
version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: w-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    expose:
      - "5000"
    networks:
      - w-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: w-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - w-network

networks:
  w-network:
    driver: bridge      